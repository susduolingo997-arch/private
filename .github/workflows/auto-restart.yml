name: Auto-restart failed render
# When "Render episode" fails, re-run its failed jobs automatically (up to 3 attempts total).
on:
  workflow_run:
    workflows: ['Render episode']
    types: [completed]
permissions:
  actions: write
jobs:
  restart:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', GH_REPO: '${{ github.repository }}' }
        run: |
          sleep 60
          gh run rerun ${{ github.event.workflow_run.id }} --failed
          echo "Restarted run ${{ github.event.workflow_run.id }} (attempt ${{ github.event.workflow_run.run_attempt }} failed)"
